[package]
name = "zenlink-airplay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AirPlay 1 screen-mirroring receiver (ZenLink Studio over Wi-Fi, Hybrid picture)."

[dependencies]
zenlink-core = { path = "../zenlink-core" }
log = { workspace = true }
serde_json = { workspace = true }
aes = "0.8"
ctr = "0.9"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
plist = "1.8"
rand = "0.8"
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
mdns-sd = "0.21.7"
if-addrs = "0.15"
