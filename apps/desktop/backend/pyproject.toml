[project]
name = "zenlink"
version = "2.5.12"
description = "Mirror and control an iPhone or iPad on Windows - Apple Driver (cable or Wi-Fi) or ZenLink Studio (cable or AirPlay) for live streaming."
# README.md and LICENSE are in the repository root.
license = "GPL-3.0-or-later"
authors = [{ name = "Zenvy Zenshiro" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.10",
    "pyusb>=1.2.1",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["av>=14", "pycryptodome>=3.20", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/zenvyzenshiro/zenlink"
Support = "https://sociabuzz.com/zenvy/tribe"

[project.gui-scripts]
zenlink = "zenlink.__main__:main"
